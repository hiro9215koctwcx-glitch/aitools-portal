<meta charset="UTF-8">
<!-- スマホ表示の基本設定。
     viewport-fit=cover ＝ iPhoneのノッチ（切り欠き）ぎわまで背景を広げる。
     そのぶん、文字やボタンが切り欠きに隠れないよう、下のCSSで余白（safe-area）を足す。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>記憶を継いだ朝 / The Morning I Inherited the Memory</title>

<!-- OGP / Twitter Card -->
<meta property="og:title"       content="記憶を継いだ朝 / The Morning I Inherited the Memory">
<meta property="og:description" content="元刑事の探偵が、記憶を売買する企業の闇に挑む。『記憶を売った夜』続編。ブラウザで遊べるノベルゲーム（プレイ時間 約60分）。">
<meta property="og:image"       content="https://hiro9215koctwcx-glitch.github.io/aitools-portal/memory-morning/ogp.png">
<meta property="og:url"         content="https://hiro9215koctwcx-glitch.github.io/aitools-portal/memory-morning/">
<meta property="og:type"        content="website">
<meta name="twitter:card"       content="summary_large_image">

<style>
  /* ============================================================
     ここは「見た目」を決める部分（CSS）です。
     色・文字の大きさ・配置などを設定しています。
     ============================================================ */

  * {
    box-sizing: border-box;      /* 幅の計算を分かりやすくするおまじない */
    margin: 0;
    padding: 0;
  }

  html, body { height: 100%; }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color: #f4f4f4;                       /* 文字色：白に近い色 */
    background: #0a0e1a;                   /* 背景：黒に近いダークネイビー */
    line-height: 1.9;                     /* 行間。広めにして読みやすく */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;                   /* スマホのアドレスバーで隠れないための新しい高さ指定 */
    overflow: hidden;
    /* 背景色がゆっくり変わるようにする（プロローグ→面談室の温度差の演出） */
    transition: background-color 1.5s ease;
    -webkit-tap-highlight-color: transparent; /* スマホでタップした時の青い枠を消す */
    -webkit-text-size-adjust: 100%;       /* スマホが勝手に文字サイズを変えるのを防ぐ */
  }

  /* プロローグ・回想の間だけ使う「温かい色」。body に付け外しして切り替える */
  body.warm {
    background: #1c1712;   /* ほんのり茶色がかった温かい闇 */
    color: #f3e9dc;        /* 少しクリーム色の文字 */
  }

  /* 真エンドの「朝」。夜が明けた、やわらかな明るさ。 */
  body.dawn {
    background: #2a3350;   /* 夜が薄まっていく、明るいネイビー */
    color: #fdf6ec;        /* あたたかい白 */
    transition: background-color 3s ease;  /* ゆっくり夜が明ける */
  }

  /* 【仕上げ①】面談室の照明。記憶を売るたびに、少しずつ暗くしていく。
     dim1（1つ売却後）→ dim2 → dim3（3つ以降）と、背景が段々暗くなる。
     文字は明るいままなので、暗くしても読みやすさは保てる。 */
  body.dim1 { background: #080b14; }
  body.dim2 { background: #05070e; }
  body.dim3 { background: #020306; }

  #game {
    width: 100%;
    max-width: 640px;
    height: 100vh;
    height: 100dvh;    /* スマホ対応の高さ指定（上と同じ理由） */
    /* 画面の縁の余白。左右は読みやすい余白、上下はノッチや下端バーを避ける余白を足す。
       clamp(最小, 画面幅に応じた値, 最大) で、狭い画面ほど余白を少し詰める。 */
    padding-top: calc(env(safe-area-inset-top) + clamp(16px, 4vw, 24px));
    padding-bottom: calc(env(safe-area-inset-bottom) + clamp(16px, 4vw, 24px));
    padding-left: calc(env(safe-area-inset-left) + clamp(18px, 5vw, 28px));
    padding-right: calc(env(safe-area-inset-right) + clamp(18px, 5vw, 28px));
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;   /* どこをクリックしても進めることを示すマーク */
    position: relative;
  }

  #textbox {
    min-height: 40vh;   /* 文が短くても位置がガタつかないように高さを確保 */
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* 話している人の名前（セラ など）。名前が無い地の文では空欄 */
  #speaker {
    font-size: clamp(0.9rem, 3.6vw, 1.0rem);   /* 画面幅に合わせて自動調整 */
    color: #8fb3d9;         /* 少し青みがかった色で名前を目立たせる */
    margin-bottom: 12px;
    letter-spacing: 0.05em;
    min-height: 1.2em;      /* 名前が無い時も高さを保って画面が揺れないように */
  }

  #text {
    /* clamp(最小, 画面幅に応じた値, 最大)。
       スマホ（狭い）では 1.05rem 前後、パソコン（広い）では 1.2rem で頭打ち。 */
    font-size: clamp(1.05rem, 4.3vw, 1.2rem);
    white-space: pre-line;      /* 台本内の改行（\n）を、画面でも改行として表示する */
    overflow-wrap: break-word;  /* 長い文が画面の端で切れず、きちんと折り返すように */
  }

  /* セリフ（かぎ括弧のセリフ）の時は少し大きく・明るく */
  #text.serif {
    font-size: clamp(1.15rem, 4.9vw, 1.3rem);
    color: #ffffff;
  }

  /* 【ver6・STEP D】セラの記録（独白）の見た目。本編とはっきり変える。
     AIの内部ログのように、等幅フォント・青緑色・左に細い線を付ける。 */
  #textbox.log #speaker {
    color: #6fb7c9;
    font-family: monospace;
    letter-spacing: 0.12em;
  }
  #textbox.log #text {
    font-family: monospace;
    color: #8fd0dd;                       /* 青緑がかった、機械的な色 */
    font-size: clamp(0.92rem, 3.7vw, 1.02rem);
    letter-spacing: 0.03em;
    border-left: 2px solid rgba(120, 190, 205, 0.45);
    padding-left: 14px;
  }

  /* 「次へ進めます」の合図（右下でチカチカする小さな三角） */
  #next-hint {
    position: absolute;
    right: calc(env(safe-area-inset-right) + 20px);
    bottom: calc(env(safe-area-inset-bottom) + 18px);
    color: #6b7a90;
    font-size: 0.9rem;
    animation: blink 1.2s ease-in-out infinite;
    pointer-events: none;   /* 合図はクリックの邪魔をしない */
  }
  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 1;   }
  }

  /* 画面右上の、控えめな「1つ前に戻る」ボタン */
  #back-btn {
    position: absolute;
    right: calc(env(safe-area-inset-right) + 8px);
    top: calc(env(safe-area-inset-top) + 6px);
    color: #d4dae4;                /* うっすら白めのグレー（暗い背景でも見える上品な明るさ） */
    font-size: clamp(0.8rem, 3.4vw, 0.88rem);
    letter-spacing: 0.08em;
    opacity: 0.6;                  /* 「そこにある」と分かる程度。明るすぎない濃さ */
    cursor: pointer;
    user-select: none;             /* 文字が選択されないように */
    transition: opacity 0.3s ease;
    display: none;                 /* 戻れる履歴ができるまでは隠す */
    /* 指で押しやすいよう、当たり判定（padding）を広めに取る。
       見た目は小さいままだが、少し外れてもタップが効く。 */
    padding: 10px 14px;
    min-height: 44px;
  }
  /* マウスがある機器では、乗せるとはっきり明るくなる（親切な合図） */
  @media (hover: hover) {
    #back-btn { opacity: 0.5; }        /* パソコンは普段もう少し控えめ */
    #back-btn:hover { opacity: 0.95; } /* 重ねると、くっきり */
  }

  /* 画面左下の、うっすらした通し番号（周回のたびに増える。理由は明かさない演出） */
  #loop-counter {
    position: absolute;
    left: calc(env(safe-area-inset-left) + 22px);
    bottom: calc(env(safe-area-inset-bottom) + 18px);
    color: #3a4657;         /* 背景に溶けるくらい薄い色 */
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    font-family: monospace;
    pointer-events: none;   /* クリックの邪魔をしない */
  }

  /* ============ 選択肢（赤い光・灰色の光）============ */
  #choices {
    display: none;              /* 普段は隠しておき、選択の場面だけ表示 */
    flex-direction: column;
    gap: 14px;
    margin-top: 24px;
  }

  /* 【ver4】思い出を選ぶ／売却を確認するボタンの並べ方。
     ボタン1つ1つの見た目は、上の .choice をそのまま使い回す。 */
  #menu {
    display: none;              /* 普段は隠す。選ぶ場面だけ表示 */
    flex-direction: column;
    gap: 14px;
    margin-top: 24px;
  }

  .choice {
    /* 指でタップしやすいよう、高さをしっかり確保（目安は 44px 以上）。 */
    min-height: 56px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.03);
    color: #f4f4f4;
    font-size: clamp(1.0rem, 4.2vw, 1.1rem);
    line-height: 1.5;
    text-align: center;
    overflow-wrap: break-word;   /* 長いラベルも折り返して、はみ出さない */
    cursor: pointer;
    transition: transform 0.15s ease, background 0.3s ease;
  }
  /* マウスがある機器（パソコン）だけ、乗せると浮く/明るくなる演出。
     スマホでは「タップしたのに押しっぱなしに見える」現象を避けるため付けない。 */
  @media (hover: hover) {
    .choice:hover { transform: translateY(-2px); }
    .choice.red:hover { background: rgba(200, 60, 60, 0.15); }
  }
  /* タップした瞬間の手ごたえ（パソコン・スマホ共通） */
  .choice:active { transform: scale(0.99); background: rgba(255,255,255,0.08); }

  /* 赤い光のボタン */
  .choice.red {
    border-color: rgba(200, 60, 60, 0.6);
    box-shadow: 0 0 18px rgba(200, 60, 60, 0.25);
  }

  /* 灰色のボタン。明るさ（opacity）はJavaScript側で周回に応じて変える */
  .choice.gray { cursor: default; }

  /* ============ 仮エンドなどの中央表示 ============ */
  #center-title {
    display: none;
    text-align: center;
    font-size: clamp(1.2rem, 5.2vw, 1.45rem);
    letter-spacing: 0.12em;
    color: #e8e8e8;
    overflow-wrap: break-word;   /* 狭い画面でもはみ出さず折り返す */
    animation: fadeInSlow 2s ease;
  }
  @keyframes fadeInSlow {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* デモの終わりを知らせる小さな注記 */
  #demo-note {
    margin-top: 28px;
    font-size: clamp(0.8rem, 3.4vw, 0.9rem);
    color: #6b7a90;
    text-align: center;
    line-height: 1.8;
    overflow-wrap: break-word;
  }

  /* 終幕ボタンエリア（「最初から読み直す」「感想をXでシェア」） */
  #finish-actions {
    display: none;          /* 普段は隠す。showFinish で flex に切り替える */
    flex-direction: column;
    gap: 14px;
    margin-top: 28px;
  }
  @keyframes finishBtnFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* 【ver3・③序盤】セラの画面に一瞬だけ映る「システム表示」。
     普段は透明。表示時に flash-anim（ふわっと出て消える）を1回だけ再生する。 */
  #flash {
    position: absolute;
    top: 18%;
    left: 0;
    right: 0;
    text-align: center;
    font-family: monospace;
    letter-spacing: 0.25em;
    font-size: clamp(0.8rem, 3.4vw, 0.95rem);
    color: #7f93b3;
    opacity: 0;                 /* 普段は見えない */
    pointer-events: none;       /* クリックの邪魔をしない */
  }
  #flash.show {
    animation: flash-anim 2.6s ease forwards;   /* 一瞬だけ浮かんで、消える */
  }

  /* 【ver5・前日譚】記憶を売った瞬間の「白飛び」。
     画面全体をパッと白くして、ゆっくり元に戻す（つらい記憶が抜ける衝撃の演出）。 */
  #whiteout {
    position: fixed;
    inset: 0;                   /* 画面いっぱいに広げる（上下左右0） */
    background: #ffffff;
    opacity: 0;                 /* 普段は透明で見えない */
    pointer-events: none;       /* クリックの邪魔をしない */
    z-index: 50;                /* いちばん手前に出す */
  }
  #whiteout.flash {
    animation: whiteflash 1.8s ease forwards;
  }
  @keyframes whiteflash {
    0%   { opacity: 0; }
    12%  { opacity: 1; }        /* パッと真っ白に飛ぶ */
    100% { opacity: 0; }        /* ゆっくり戻る */
  }

  /* 【ver6・STEP C】振込のお知らせ。金額の数字を大きく、はっきり見せる。
     ふわっと浮かんで、数秒で消える（flash と同じ考え方）。 */
  #money-notice {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 24px;
    border: 1px solid rgba(150, 200, 160, 0.5);
    border-radius: 10px;
    background: rgba(18, 28, 22, 0.88);
    color: #bfe0c6;
    font-family: monospace;
    letter-spacing: 0.08em;
    font-size: clamp(0.8rem, 3.2vw, 0.95rem);
    text-align: center;
    opacity: 0;                 /* 普段は見えない */
    pointer-events: none;       /* クリックの邪魔をしない */
    z-index: 40;
    white-space: nowrap;
  }
  /* 金額の数字だけ、特に大きく見せる */
  #money-notice .amount {
    display: block;
    margin-top: 6px;
    font-size: clamp(1.6rem, 8vw, 2.3rem);
    color: #eafff0;
    letter-spacing: 0.04em;
  }
  #money-notice.show {
    animation: money-anim 3.6s ease forwards;
  }
  @keyframes money-anim {
    0%   { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    12%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes flash-anim {
    0%   { opacity: 0; }
    18%  { opacity: 0.55; }     /* うっすら浮かぶ（強すぎない） */
    70%  { opacity: 0.35; }
    100% { opacity: 0; }        /* すっと消える */
  }

  /* 【ver3・③最終盤】2つの名前を大きく並べて見せるパネル */
  #name-reveal {
    display: none;              /* 普段は隠す。最終盤でだけ表示 */
    text-align: center;
    width: 100%;
  }
  .name-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.4em;
    margin: 18px 0;
    opacity: 0;                             /* 最初は透明で、順番にゆっくり浮かぶ */
    animation: fadeInSlow 1.4s ease forwards;
  }
  .name-row.second { animation-delay: 1.2s; }  /* 2行目は少し遅れて出す */
  .name-label {
    font-size: clamp(1.0rem, 4vw, 1.3rem);
    color: #9fb0c8;
  }
  .name-kanji {
    font-size: clamp(2.4rem, 12vw, 3.6rem);   /* 漢字を大きく見せて、違いを際立たせる */
    color: #ffffff;
    letter-spacing: 0.05em;
  }
  .name-yomi {
    font-size: clamp(1.0rem, 4vw, 1.3rem);
    color: #9fb0c8;
  }

  /* ===== タイトル画面（ゲーム開始前にだけ表示） ===== */
  #title-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0e1a;
    padding:
      calc(env(safe-area-inset-top) + 24px)
      calc(env(safe-area-inset-right) + 20px)
      calc(env(safe-area-inset-bottom) + 24px)
      calc(env(safe-area-inset-left) + 20px);
  }
  #title-screen.is-hidden {
    display: none;
  }
  .title-screen__inner {
    text-align: center;
    width: 100%;
    max-width: 520px;
  }
  .title-screen__main {
    font-size: clamp(1.6rem, 6.5vw, 2.35rem);
    font-weight: 600;
    color: #f4f4f4;
    letter-spacing: 0.14em;
    line-height: 1.5;
    margin-bottom: 0.85rem;
    opacity: 0;
    animation: titleFadeIn 2.5s ease forwards;
  }
  .title-screen__sub {
    font-size: clamp(0.72rem, 2.8vw, 0.88rem);
    color: #7a8499;
    letter-spacing: 0.06em;
    margin-bottom: clamp(2.5rem, 8vw, 3.5rem);
    opacity: 0;
    animation: titleFadeIn 2.5s ease 0.45s forwards;
  }
  #title-start-btn {
    display: inline-block;
    padding: 12px 36px;
    font-family: inherit;
    font-size: clamp(0.92rem, 3.4vw, 1rem);
    font-weight: 500;
    letter-spacing: 0.12em;
    color: #c5d0e0;
    background: transparent;
    border: 1px solid rgba(143, 163, 190, 0.4);
    cursor: pointer;
    opacity: 0;
    animation: titleFadeIn 2.5s ease 0.9s forwards;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  #title-start-btn:hover {
    color: #f4f4f4;
    border-color: rgba(143, 179, 217, 0.65);
  }
  @keyframes titleFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ============================================================
     『記憶を継いだ朝』本編用の背景（場面ごとの色）と演出のスタイル。
     場面転換のたびに body へクラスを付け替え、上の 1.5秒 transition で
     ゆっくり色が変わる＝「フェードで場面が変わる」演出になる。
     ============================================================ */

  /* P-1：ニュース／暗転。ほぼ真っ黒。 */
  body.dark    { background: #05070c; }

  /* 探偵事務所。落ち着いた、ほんのり暖色の闇。 */
  body.office  { background: #16130f; color: #eae3d8; }

  /* 療養施設・面会室。午後の光がさす、やわらかいグレー。 */
  body.facility { background: #20242b; color: #eceff3; }

  /* 回想シーン。セピア（色あせた古い記憶）。 */
  body.sepia   { background: #241d13; color: #e3cfa8; }
  body.sepia #speaker      { color: #b39a6f; }
  body.sepia #text.serif   { color: #f4e6c8; }

  /* ムネモシュネ社。無機質で明るい「白い部屋」。ここだけ文字を濃い色に反転する。 */
  body.clinic  { background: #e9edf1; color: #232a33; }
  body.clinic #speaker     { color: #5b7186; }
  body.clinic #text.serif  { color: #11161c; }
  body.clinic #next-hint   { color: #7c8a9c; }
  body.clinic #back-btn    { color: #3a4657; }

  /* テレビのニュース音声（『』）。放送っぽく、少しくすんだ色＋字間広め。 */
  #textbox.tv #text {
    color: #aab6c6;
    letter-spacing: 0.06em;
  }

  /* 記憶カウンセリングAI「レテ」のセリフ（『』）。人間と区別できる色に。 */
  #textbox.ai #text        { color: #86d8e0; }          /* 暗い背景のとき */
  body.clinic #textbox.ai #text { color: #0e7c86; }     /* 白い部屋のとき（濃いティール） */

  /* 【演出①】レテの口癖がまざる瞬間の、ほんのわずかな“ゆらぎ”（大げさにしない）。 */
  #textbox.glitch #text {
    animation: leteGlitch 0.7s steps(2, end) 1;
  }
  @keyframes leteGlitch {
    0%   { opacity: 1;   }
    25%  { opacity: 0.45;}
    50%  { opacity: 1;   }
    72%  { opacity: 0.55;}
    100% { opacity: 1;   }
  }

  /* P-1：音声がぶつりと切れる「暗転（ブラックアウト）」。#whiteout を黒で使い回す。 */
  #whiteout.blackout {
    background: #000000;

    52%  { opacity: 0.04; }   /* いったん沈み */

  @keyframes montageFlow {

    68%  { opacity: 1; transform: translateY(0);     }

  }

  /* 【演出4】5-8 ニュースのリフレイン。

  #textbox.refrain #speaker { display: none; }

    from { opacity: 0; }
    to   { opacity: 1; }
  }

       text    … 表示する文章（配列にすると複数行を1画面にまとめる）

       glitch  … true にすると、表示のとき一瞬だけ“ゆらぐ”（演出①）

   ● 特別なコマ（type 付き）
     { type:"scene", mood:"…" } … 場面転換。mood で背景の色を変える（フェード）。

    { speaker: "", text: "「記憶の逆流」——今でこそ、その言葉は世間に知られている。だが十年前、それを訴える人間は、ただの精神を病んだ患者として片づけられていた。" },
    { speaker: "", text: "水島も、その一人だった。妻の証言。「行ったこともない海辺の町で、会ったこともない女の人が死ぬ夢を、毎晩見る」。売ったはずの記憶ではなく、知らない記憶が、頭に流れ込んでくる。" },

    { speaker: "", text: "それから先は、あっという間だった。" },

    /* ----- 現在の事務所へ戻る（千鶴さんの依頼の続き） ----- */
    { type: "scene", mood: "office" },
    { speaker: "", text: "千鶴さんの話を、俺は三度、聞き直した。" },
    { speaker: "", text: "響が警察を辞めたあと、何をしていたのか。母親も、多くは知らなかった。ただ、二年ほど前から、どこかの会社で契約社員として働いていたこと。そして半年ほど前から、まるで人が変わったように無口になり——ある日突然、別人のようになって帰ってきたこと。" },
    { speaker: "", serif: true, text: "「病院では、記憶を失っていると。……本人が同意して、記憶を売ったんだろうと、言われました」" },
    { speaker: "", serif: true, text: "「響が、自分で売ったと?」" },
    { speaker: "", serif: true, text: "「そんなはずないんです」千鶴さんの声が、震えた。「あの子は、何かを調べていました。最後に会った日、こう言って笑ったんです。——『母さん、俺はやり残した宿題を、やってるだけだよ』って」" },

    /* ----- 1-1 療養施設・面会室（響との対面） ----- */
    { type: "scene", mood: "facility" },
    { speaker: "", text: "療養施設は、白い建物だった。" },
    { speaker: "", text: "消毒液の匂い。柔らかいスリッパの音。何もかもが清潔で、何もかもが、静かすぎた。" },
    { speaker: "", text: "面会室に通されて、俺は、そこにいる男を見た。" },
    { speaker: "", text: "車椅子に座って、窓の外を見ている。" },
    { speaker: "", text: "——響だった。" },
    { speaker: "", text: "面影は、ある。確かに、ある。あの生意気な若造が、少し歳を取った顔。だが、それだけだった。" },
    { speaker: "", serif: true, text: "「響。……常盤だ。わかるか」" },
    { speaker: "", text: "返事はない。" },
    { speaker: "", serif: true, text: "「おい。響」" },
    { speaker: "", text: "視線すら、動かない。窓の外の何を見ているのかと思ったが——たぶん、何も見ていない。ただ、目を、開けているだけだ。" },
    { speaker: "", text: "俺は膝をついて、あいつの目の高さに、自分を合わせた。" },
    { speaker: "", text: "近くで見ると、よけいに分かった。この目には、何も映っていない。恐怖も、痛みも、諦めすらもない。あるべきものが、根こそぎ、抜き取られている。" },
    { speaker: "", serif: true, text: "「……おまえ、俺のこと、忘れたのか」" },
    { speaker: "", text: "忘れた、という言葉すら、生温い気がした。忘れるためには、まず、覚えていなければならない。この男の中には、忘れる対象すら、もう、残っていない。" },
    { speaker: "", text: "千鶴さんが、そっと息子の手を握って、さすっていた。" },

    { speaker: "", text: "実家の、六畳の和室。几帳面なあいつらしく、片づいていた。だが、片づきすぎていた。まるで、いつ消えてもいいように、身辺を整理したあとのような。" },
    { speaker: "", text: "机の引き出しを開ける。空っぽだった。本棚も、ほとんど何もない。" },

    { speaker: "", text: "だが、響は俺の教え子だ。俺の教え子なら、必ず、どこかに一つだけ、残す。" },

    { speaker: "", text: "俺の教え子の、几帳面な字だった。" },

    /* ----- 1-3 決意と作戦 → 選択② ----- */
    { type: "scene", mood: "office" },
    { speaker: "", text: "事務所に戻って、俺は一晩、考えた。" },
    { speaker: "", text: "表から、ムネモシュネ社を叩く道はない。十年前に、全部塞がれている。警察も、マスコミも、司法も——あの会社の周りだけ、道が消えている。国家が、一企業を守っている。そういう相手だ。" },
    { speaker: "", text: "なら、どうする。" },
    { speaker: "", text: "答えは、響のメモが教えてくれていた。" },
    { speaker: "", text: "記憶は、売った後どこへ行く。——それを知るには、外から眺めていても駄目だ。自分の記憶を、あの会社に流し込んで、内側から、その行方を追うしかない。" },
    { speaker: "", text: "俺は、決めた。" },
    { speaker: "", text: "顧客として、潜入する。辛い記憶に悩む、ただの一般人として、ムネモシュネ社の扉を叩く。そして、記憶を売る。売った記憶が、どこへ運ばれ、誰の手に渡るのか——餌になるのは、俺自身の頭の中身だ。" },
    { speaker: "", text: "危険なのは、分かっていた。記憶を売れば、俺自身が、少しずつ削れていく。売った先で、何が待っているかも分からない。" },
    { speaker: "", text: "だが、それしかなかった。" },
    { speaker: "", text: "もう一つ、計算があった。あの会社は、たぶん、「重い記憶を持つ客」ほど、深部へ通す。ありふれた記憶なんて、いくらでも手に入る。連中が本当に欲しがるのは、濃い痛みだ。深い後悔だ。——だとしたら、俺は、格好の客になれる。十年分の、腐るほど重い後悔を、抱えているんだから。" },

    { speaker: "", serif: true, text: "「今度は、俺が階段の下で、待っててやる」" },

/* ============================================================
   選択分岐の仕組み（今作の新機能）。前作にはなかった処理。
   ・showDecision … 2つのボタンを出す（renderMenu を利用）
   ・chooseOption … 選んだ枝（offer/refuse）を今の位置に差し込んで続ける
   ============================================================ */
function showDecision(step) {
  const buttons = step.options.map((opt) => ({
    label: opt.label,
    onClick: () => chooseOption(opt.go),
  }));
  renderMenu(buttons);   // #menu に選択肢ボタンを並べて表示
}

function chooseOption(go) {
  gameEl.style.cursor = "pointer";   // メニュー表示中に default にした分を戻す
  const branch = (go === "offer") ? offerBranch() : refuseBranch();
  script.splice(index, 0, ...branch);   // 選んだ枝を、今の続きに差し込む
  advance();
}

/* ============================================================
   没入型の選択（結末は変わらない）。選んだ内容を picks に記録し、
   物語はそのまま続く。あとの章で picks を参照できる。
   ・showPick  … 選択肢ボタンを出す（renderMenu を利用）
   ・choosePick … 選んだ内容を picks[store] に記録し、必要なら一言表示して続行
   ============================================================ */
function showPick(step) {
  const buttons = step.options.map((opt) => ({
    label: opt.label,
    onClick: () => choosePick(step, opt),
  }));
  renderMenu(buttons);
}

function choosePick(step, opt) {
  if (step.store) {
    picks[step.store] = { value: opt.value, label: opt.label, say: opt.say || "" };
  }
  gameEl.style.cursor = "pointer";
  // 選んだセリフ（say）があれば、その一言だけを本文として差し込んでから続ける。
  // 心の中の思い（かぎ括弧でないもの）は serif:false を指定すると、地の文の見た目になる。
  const branch = [];
  if (opt.say) { branch.push({ speaker: "", serif: (opt.serif !== false), text: opt.say }); }
  script.splice(index, 0, ...branch);
  advance();
}

/* ---- バッドエンドの最後（「それでも、進みますか?」）----
   次にクリックすると returnToTitle() でタイトル画面へ戻る。 */
function showBadEndTitle(text) {
  textboxEl.style.display = "none";
  textboxEl.classList.remove("tv", "ai", "rec", "glitch", "montage", "log", "flow", "refrain", "garbling");
  titleEl.classList.remove("logo");
  titleEl.textContent = text;
  titleEl.style.display = "block";
  hintEl.textContent = "▼";
  hintEl.style.display = "block";
  pendingReturnToTitle = true;   // 次のクリックでタイトルへ
  saveHistory({ kind: "center", titleText: text, noteText: "", atLoopEnd: false,
                hintText: "▼", hintVisible: true });
}

/* ---- タイトル画面へ戻る（バッドエンド後）。「続きから」を出せるようにする。 ---- */
function returnToTitle() {
  if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
  bodyEl.className = "";
  textboxEl.style.display = "none";
  textboxEl.classList.remove("tv", "ai", "rec", "glitch", "montage", "log", "flow", "refrain", "garbling");
  titleEl.style.display = "none";
  titleEl.classList.remove("logo");
  menuEl.style.display = "none";
  hintEl.style.display = "none";
  finishActionsEl.style.display = "none";
  canContinue = true;            // 選択の直前から再開できるようにする
  updateContinueButton();
  titleScreenEl.classList.remove("is-hidden");
}

/* ---- 「続きから」ボタンの表示・非表示を切り替える ---- */
function updateContinueButton() {
  continueBtn.style.display = canContinue ? "inline-block" : "none";
}

/* ---- 「続きから」：選択の直前（checkpoint）から本編を再開する ---- */
function startFromChoice() {
  history = [];
  counterEl.textContent = "";
  bodyEl.className = "";
  pendingReturnToTitle = false;
  atLoopEnd = false;
  choosing = false;
  // 注：「続きから」は第4章から再開するため、第0章／第1章の選択（picks）は入りません。
  script = scenarioScript();
  index = script.findIndex((s) => s.type === "checkpoint");
  if (index < 0) index = 0;   // 念のため（見つからなければ最初から）
  advance();
}

/* ---- 1コマ進める処理 ---------------------------------------- */
function advance() {
  // バッドエンドの「それでも、進みますか?」表示中なら、クリックでタイトルへ戻る
  if (pendingReturnToTitle) {
    pendingReturnToTitle = false;
    returnToTitle();
    return;
  }

  // 仮エンド表示中なら、クリックで次の周回へ
  if (atLoopEnd) {
    atLoopEnd = false;
    startNextLoop();
    return;
  }

  // 走馬灯の自動送り中にクリックされたら、待たずにすぐ次の断片へ（スキップ／早送り）
  if (autoAdvancing) {
    clearTimeout(autoTimer);
    autoAdvancing = false;
    choosing = false;
    advance();
    return;
  }

  // 選択肢を表示している間は、画面クリックでは進めない（ボタンで選んでもらう）
  if (choosing) return;

  // 文字を出し切る前にクリックされたら、残りを一気に表示する
  if (typing) {
    finishTyping();
    return;
  }

  // 台本の最後まで来たら、それ以上は何もしない
  if (index >= script.length) return;

  const step = script[index];   // いまのコマ
  index++;                      // 次のコマへ進めておく

  // --- 特別なコマ（type付き）の処理 ---
  if (step.type === "scene") {
    // 場面転換：いったん背景クラスを全部外して、指定された mood を1つ付ける。
    // body の transition により、色がゆっくり変わる＝フェードの場面転換になる。
    bodyEl.classList.remove(
      "warm", "dawn", "dim1", "dim2", "dim3",
      "dark", "office", "clinic", "clinicdim", "facility", "sepia", "white",
      "server", "daylight"
    );
    counterEl.textContent = "";     // このゲームでは左下の通し番号は使わない
    if (step.mood) {
      bodyEl.classList.add(step.mood);
    }
    advance();  // 場面転換だけでは止まらず、すぐ次の文へ
    return;
  }

  // 「続きから」で再開する目印。通り過ぎるだけ（何も表示しない）。
  if (step.type === "checkpoint") {
    advance();
    return;
  }

  // 【没入型の選択】選んだ内容を記録して、そのまま物語を続ける（結末は変わらない）。
  if (step.type === "pick") {
    showPick(step);
    return;
  }

  // 【今作の新機能】選択分岐。2つのボタンを出し、選んだ枝を差し込む。
  if (step.type === "decision") {
    showDecision(step);
    return;
  }

  // バッドエンドの最後（「それでも、進みますか?」→ 次クリックでタイトルへ）。
  if (step.type === "badEndTitle") {
    showBadEndTitle(step.text);
    return;
  }

  // 一拍おく（無言の“間”）。少しだけ待ってから、自動で次の文へ進む。
  if (step.type === "beat") {
    choosing = true;                // 待っている間はクリックで先に進めない
    hintEl.style.display = "none";
    setTimeout(() => { choosing = false; advance(); }, step.ms || 900);
    return;
  }

  // 暗転（画面がぶつっと暗くなる）。すぐ次の文へ。
  if (step.type === "blackout") {
    triggerBlackout();
    advance();
    return;
  }

  // 【演出1】文字化け（3-4「センパ――」）。演出内で自動的に次へ進む。
  if (step.type === "garble") {
    showGarble(step);
    return;
  }

  // 【演出4】ニュースのリフレイン（5-8）。P-1のニュースに響の声が重なる。
  if (step.type === "refrain") {
    showRefrain(step);
    return;
  }

  // タイトルロゴのフェードイン（プロローグの最後で表示）。
  if (step.type === "logo") {
    showLogo();
    return;
  }

  // 「続きは実装中」で止める仮の終わり。
  if (step.type === "todo") {
    showTodo(step.text);
    return;
  }

  if (step.type === "flag") {
    // 物語の段階を切り替える目印（例：最終周フラグを立てる）
    stage = step.stage;
    advance();
    return;
  }

  if (step.type === "whiteout") {
    triggerWhiteout();   // 【ver5】画面を一瞬白く飛ばして、すぐ次の文へ
    advance();
    return;
  }

  if (step.type === "money") {
    triggerMoney();      // 【ver6】振込のお知らせを出して、すぐ次の文へ
    advance();
    return;
  }

  if (step.type === "bgm") {
    startEndingBgm();    // 【ver6・STEP F】静かなピアノを鳴らし始めて、すぐ次の文へ
    advance();
    return;
  }

  if (step.type === "firstSellChoice") {
    showFirstSellChoice();   // 【ver5】前日譚：最初の売却「売る／できない」
    return;
  }

  if (step.type === "choice") {
    showChoices(step);
    return;
  }

  if (step.type === "memorySelect") {
    showMemorySelect();        // 【ver4】「どの思い出を売る?」のボタンを出す
    return;
  }

  if (step.type === "memoryConfirm") {
    showSellConfirm(step.id);  // 【ver4】「この記憶を売る?」の確認ボタンを出す
    return;
  }

  if (step.type === "title") {
    showTitle(step.text);
    return;
  }

  if (step.type === "ending") {
    showEnding(step.text);   // 真エンドの中央表示（クリックでエピローグへ続く）
    return;
  }

  if (step.type === "finish") {
    showFinish(step.text);   // 本当の最後（ここで物語は終わり）
    return;
  }

  if (step.type === "names") {
    showNames();             // 【ver3・③】2つの名前を大きく並べて見せる
    return;
  }

  // --- 普通のセリフ・地の文の処理 ---
  // 直前に中央表示（ロゴ/エンド/名前パネル）が出ていた場合にそなえ、文章表示に戻す
  textboxEl.style.display = "flex";
  titleEl.style.display = "none";
  titleEl.classList.remove("logo");     // ロゴ表示のスタイルが残らないように外す
  nameRevealEl.style.display = "none";
  speakerEl.textContent = step.speaker || "";
  if (step.serif) {
    textEl.classList.add("serif");
  } else {
    textEl.classList.remove("serif");
  }
  // 【ver6・STEP D】log:true のコマは「セラの記録（独白）」の見た目にする
  textboxEl.classList.toggle("log", !!step.log);
  // voice で文章の見た目を変える："tv"＝ニュース音声／"ai"＝AI「レテ」／"rec"＝響の録音
  textboxEl.classList.toggle("tv", step.voice === "tv");
  textboxEl.classList.toggle("ai", step.voice === "ai");
  textboxEl.classList.toggle("rec", step.voice === "rec");
  // 【演出①】glitch:true のコマは、表示のときに一瞬だけ“ゆらぐ”
  textboxEl.classList.toggle("glitch", !!step.glitch);
  // montage:true のコマは、走馬灯（中央寄せ・ふわっと出す）の見た目にする
  textboxEl.classList.toggle("montage", !!step.montage);
  // auto:true（走馬灯の自動送り）のコマは、下から現れて上へ流れる見た目にする
  textboxEl.classList.toggle("flow", !!step.auto);
  // 特殊演出用のクラスは、ふつうのコマでは必ず外しておく（前のコマから残さない）
  textboxEl.classList.remove("refrain", "garbling");
  // text が配列（まとまり）なら、改行でつないで1画面にまとめて表示する。
  // ふつうの文字列ならそのまま表示する。
  const shown = Array.isArray(step.text) ? step.text.join("\n") : step.text;
  saveHistory({ kind: "text", speaker: step.speaker || "", textShown: shown, serif: !!step.serif, log: !!step.log, flash: step.flash || "", voice: step.voice || "", montage: !!step.montage });
  if (step.auto) {
    // 【演出3】走馬灯の自動送り：全文を一気に出し、CSSアニメで流し、一定時間で次へ。
    textEl.textContent = shown;
    typing = false;
    hintEl.style.display = "none";
    choosing = true;          // 自動送り中は通常クリックで進めない（上の autoAdvancing でスキップ）
    autoAdvancing = true;
    // アニメーションを最初から再生させる（同じ要素なので、いったん止めて動かし直す）
    textEl.style.animation = "none";
    void textEl.offsetWidth;
    textEl.style.animation = "";
    clearTimeout(autoTimer);
    autoTimer = setTimeout(function () {
      autoAdvancing = false;
      choosing = false;
      advance();
    }, step.ms || 1800);
  } else {
    typeText(shown);
  }
  // 【ver3・③序盤】この画面に flash 指定があれば、一瞬だけシステム表示を光らせる
  if (step.flash) { triggerFlash(step.flash); }
  // 【演出2補足】pulse:true のコマは、モニターの光をごく淡く揺らす
  if (step.pulse) { triggerSoftPulse(); }
}

/* ---- 文章を1文字ずつ表示する（タイプライター風）---- */
function typeText(fullText) {
  currentText = fullText;
  textEl.textContent = "";
  typing = true;
  hintEl.style.display = "none";

  let charIndex = 0;
  typeTimer = setInterval(() => {
    textEl.textContent += fullText[charIndex];
    charIndex++;
    if (charIndex >= fullText.length) {
      finishTyping();
    }
  }, 30);   // 30ミリ秒ごとに1文字（小さくすると速くなります／まとめ表示に合わせて少し速めに）
}

/* ---- 1文字ずつ表示を、すぐ全部表示に切り替える ---- */
function finishTyping() {
  clearInterval(typeTimer);
  textEl.textContent = currentText;
  typing = false;
  hintEl.style.display = "block";
}

/* ---- 選択肢を表示する ----
   step には赤・灰それぞれのラベルや進み先、灰色の明るさが入っている。 */
function showChoices(step) {
  choosing = true;
  currentChoice = step;                 // あとでボタンが押されたとき使う
  redBtn.textContent  = step.redLabel;  // ボタンの文言を場面に合わせて差し替え
  grayBtn.textContent = step.grayLabel;
  grayBtn.style.opacity = step.grayOpacity;   // 灰色の明るさ（10% or 40%）
  choicesEl.style.display = "flex";
  hintEl.style.display = "none";
  gameEl.style.cursor = "default";
}

/* 選んだあと、その進み先（steps）を今の位置に差し込んで再生する */
function playBranch(branch) {
  choosing = false;
  currentChoice = null;
  choicesEl.style.display = "none";
  gameEl.style.cursor = "pointer";
  // いま再生中の台本の続きとして、選んだ枝を差し込む
  script.splice(index, 0, ...branch);
  advance();
}

/* ============================================================
   【ver4】記憶を「選んで売る」仕組み
   ここが今回の中心。流れは次のとおり：
     ① showMemorySelect …「どの思い出を売る?」（残っている思い出だけボタンに）
     ② chooseMemory     … 選んだ思い出の回想を流し、売却確認へ
     ③ showSellConfirm  …「この記憶を売る?」（売る／やめておく）
     ④ sellMemory       … 売る → その思い出を sold=true にして選択肢から消す
        keepMemory       … やめる → もう一度 選択画面へ戻る
     ⑤ 4つ全部売り終えたら → 中盤（buildMidScript）へ
   ============================================================ */

/* ---- ボタンを動的に作って表示する共通の部品 ----
   buttons … [{ label:"表示文言", className:"red など（省略可）", onClick:関数 }] の配列。
   ボタンを押すと、そのボタンの onClick が呼ばれる。 */
function renderMenu(buttons) {
  choosing = true;                    // 表示中は画面クリックで進めない
  currentChoice = null;
  choicesEl.style.display = "none";   // 赤・灰の選択肢とは別物なので隠しておく
  menuEl.innerHTML = "";              // 前回のボタンを消してから作り直す
  buttons.forEach((b) => {
    const el = document.createElement("div");
    el.className = "choice" + (b.className ? " " + b.className : "");
    el.textContent = b.label;
    el.addEventListener("click", (e) => {
      e.stopPropagation();            // 画面全体のクリック（前進）と二重反応しないように
      menuEl.style.display = "none";
      choosing = false;
      b.onClick();
    });
    menuEl.appendChild(el);
  });
  menuEl.style.display = "flex";
  hintEl.style.display = "none";
  gameEl.style.cursor = "default";
}

/* ---- 【仕上げ①】面談室の照明を、売った数に応じて暗くする ----
   売った思い出の数を数え、0→そのまま／1→dim1／2→dim2／3つ以上→dim3。 */
function applyRoomDim() {
  bodyEl.classList.remove("dim1", "dim2", "dim3");
  const sold = memories.filter((m) => m.sold).length;
  if (sold >= 3)      bodyEl.classList.add("dim3");
  else if (sold === 2) bodyEl.classList.add("dim2");
  else if (sold === 1) bodyEl.classList.add("dim1");
  // sold === 0 のときは、まだ暗くしない（通常の明るさ）
}

/* ---- 【演出1】3-4：レテが「センパ」と漏らし、文字化けし、システムが暗転で打ち消す ----
   ① 前半を普通に1文字ずつ出す → ② 「センパ――」をノイズ文字でブラす（0.4秒ほど）
   → ③ 暗転（既存の blackout）で打ち消す → ④ 黒がかぶった間に『常盤様』へ自動で進む。 */
function showGarble(step) {
  const pre = step.pre || "", noise = step.noise || "", tail = step.tail || "";
  // レテのセリフとして表示準備（色はレテのまま）
  textboxEl.style.display = "flex";
  titleEl.style.display = "none";
  titleEl.classList.remove("logo");
  nameRevealEl.style.display = "none";
  speakerEl.textContent = "";
  textEl.classList.add("serif");
  textboxEl.classList.remove("log", "tv", "rec", "montage", "flow", "refrain", "garbling");
  textboxEl.classList.add("ai");
  hintEl.style.display = "none";
  choosing = true;   // 演出中はクリックで進めない
  typing = false;
  // 「もどる」で戻ったときは、読める形（センパ――）を静かに表示する
  saveHistory({ kind: "text", speaker: "", textShown: pre + noise + tail, serif: true, log: false, flash: "", voice: "ai", montage: false });

  // ① 前半をふつうに1文字ずつ
  let i = 0;
  textEl.textContent = "";
  const t1 = setInterval(function () {
    i++;
    textEl.textContent = pre.slice(0, i);
    if (i >= pre.length) { clearInterval(t1); scramble(); }
  }, 30);

  // ② 「センパ――」を、本物とノイズ文字が二重にぶれるように差し替え続ける
  function scramble() {
    textboxEl.classList.add("garbling");
    const glyphs = "ｼﾞｬﾋﾞﾂﾉｲｽﾞ▓▚▟◆◇▨▧〓╱╲※＃░▒";
    let f = 0;
    const t2 = setInterval(function () {
      f++;
      let mid = "";
      for (let k = 0; k < noise.length; k++) {
        mid += (Math.random() < 0.5) ? noise[k] : glyphs[Math.floor(Math.random() * glyphs.length)];
      }
      textEl.textContent = pre + mid + tail;
      if (f >= 13) {                 // 約0.43秒ブレる
        clearInterval(t2);
        triggerBlackout();           // ③ システムが打ち消す＝暗転
        textboxEl.classList.remove("garbling");
        // ④ 黒がかぶっている間に、次の『常盤様』へ
        setTimeout(function () { choosing = false; advance(); }, 480);
      }
    }, 33);
  }
}

/* ---- 【ver6・STEP F】静かなピアノBGM（音声ファイル不要。ブラウザで音を合成する）----
   真エンドでだけ、そっと鳴らす。低い音量で、やわらかい音を、ゆっくり繰り返す。 */
let audioCtx = null;      // 音を鳴らすための装置（初回に一度だけ作る）
let bgmTimer = null;      // 繰り返し再生用のタイマー（二重再生を防ぐ目印にもなる）

/* 1つの音を、やわらかく鳴らす（ふわっと出て、すーっと消える） */
function playSoftNote(freq, startTime, dur, peak) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";                    // 角のない、やさしい音色
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.linearRampToValueAtTime(peak, startTime + 0.05);        // ふわっと立ち上がる
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);  // すーっと消える
  osc.start(startTime);
  osc.stop(startTime + dur + 0.05);
}

/* 真エンドのBGMを鳴らし始める（すでに鳴っていれば何もしない） */
function startEndingBgm() {
  if (bgmTimer) return;   // 二重に鳴らさない
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    return;               // 音が使えない環境でも、物語は止めない
  }
  if (audioCtx.state === "suspended") { audioCtx.resume(); }

  // やさしい短いフレーズ（ドレミの音の高さ）。ゆっくり繰り返す。
  const phrase = [523.25, 659.25, 783.99, 659.25, 587.33, 493.88];
  let step = 0;
  const tick = () => {
    const now = audioCtx.currentTime;
    playSoftNote(phrase[step % phrase.length], now, 1.6, 0.06);   // 主旋律（小さめの音量）
    if (step % 3 === 0) {
      playSoftNote(phrase[step % phrase.length] / 2, now, 2.2, 0.035);  // ときどき低音をそっと添える
    }
    step++;
    bgmTimer = setTimeout(tick, 900);   // 0.9秒ごとに次の音へ
  };
  tick();
}

/* ---- 【ver3・③序盤】一瞬だけ「システム表示」を光らせる ---- */
function triggerFlash(text) {
  flashEl.textContent = text;
  flashEl.classList.remove("show");
  // いったんクラスを外し、少し待ってから付け直すと、アニメを最初から再生できる
  void flashEl.offsetWidth;   // ブラウザに描画をやり直させるためのおまじない
  flashEl.classList.add("show");
}

/* ---- 【ver3・③最終盤】2つの名前を大きく並べて見せる ---- */
function showNames() {
  textboxEl.style.display = "none";
  titleEl.style.display = "none";
  // 前作の名前演出は削除（続編では未使用）。使うときはここに innerHTML を組み立てる。
  nameRevealEl.innerHTML = "";
  nameRevealEl.style.display = "block";
  hintEl.textContent = "▼";
  hintEl.style.display = "block";
  // クリックで次の文へ進む（atLoopEnd は立てない）
  saveHistory({ kind: "names" });
}

/* ---- 本当の最後（物語の終わり）---- */
function showFinish(text) {
  textboxEl.style.display = "none";
  textboxEl.classList.remove("tv", "ai", "rec", "glitch", "montage", "log", "flow", "refrain", "garbling");
  titleEl.classList.remove("logo");
  hintEl.style.display = "none";
  titleEl.textContent = text;
  titleEl.style.display = "block";
  noteEl.style.display = "none";
  // 2.5秒後にフェードインでボタンを出す
  finishActionsEl.style.opacity = "0";
  finishActionsEl.style.animation = "finishBtnFadeIn 1s ease 2.5s forwards";
  finishActionsEl.style.display = "flex";
  saveHistory({ kind: "center", titleText: text, noteText: "", atLoopEnd: false,
                hintText: "▼", hintVisible: false });
}

/* ---- 次の周回を始める ---- */
function startNextLoop() {
  loopCount++;                 // 次の日（次の周回）へ。左下の通し番号も1つ増える
  updateLoopCounter();

  // まだ売っていない記憶が残っているか数える
  const remaining = memories.filter((m) => !m.sold).length;

  // 段階に応じて、次の台本を組み立てる
  if (stage === "final") {
    // 中盤で灰色を選んだあと：最終周『反転』へ
    script = buildFinalScript();
  } else if (remaining === 0) {
    // 【ver6・STEP A】4つの記憶をすべて売り終えた：中盤『真実の入口』へ
    stage = "mid";
    script = buildMidScript();
  } else {
    // 【ver6・STEP A】まだ記憶が残っている：また面談室に戻り、次の1つを選ぶ
    script = interviewIntroScript(loopCount);
  }
  index = 0;
  resetSceneUI();
  advance();
}

/* ---- 画面を「1コマ目を表示できる」状態に戻す ---- */
function resetSceneUI() {
  bodyEl.classList.remove("warm", "dawn", "dim1", "dim2", "dim3");  // 背景を面談室に戻す
  applyRoomDim();                            // 【仕上げ①】売った数ぶんの暗さは保つ
  textboxEl.style.display = "flex";
  titleEl.style.display = "none";
  noteEl.style.display = "none";
  finishActionsEl.style.display = "none";
  finishActionsEl.style.animation = "";
  nameRevealEl.style.display = "none";       // 名前パネルも隠す
  menuEl.style.display = "none";             // 【ver4】思い出選択ボタンも隠す
  flashEl.classList.remove("show");          // システム表示（flash）も消しておく
  moneyEl.classList.remove("show");          // 【ver6】振込のお知らせも消しておく
  textboxEl.classList.remove("log");         // 【ver6・STEP D】独白デザインも外す
  speakerEl.textContent = "";
  textEl.textContent = "";
  hintEl.textContent = "▼";
  gameEl.style.cursor = "pointer";
  choosing = false;
  atLoopEnd = false;
  currentChoice = null;
}

/* ---- 左下の通し番号を更新（周回のたびに1つ増える）---- */
function updateLoopCounter() {
  // 例：1周目 → "No.0001"、2周目 → "No.0002" … と増えていく
  counterEl.textContent = "No." + String(loopCount).padStart(4, "0");
}

/* ============================================================
   「1つ前に戻る」の仕組み
   ============================================================ */

/* ---- 画面を表示するたびに、その状態の控え（スナップショット）を履歴に積む ----
   view には画面の見た目（text か center か、その文章など）が入っている。
   あわせて、進行状況（台本・位置・段階・周回・背景色・通し番号）も控えておくと、
   戻ったときに「その先も正しく読み進められる」ように復元できる。 */
function saveHistory(view) {
  history.push(Object.assign({}, view, {
    scriptCopy: script.slice(),     // 台本のコピー（選択で枝が差し込まれても崩れないように）
    index: index,                   // 次に表示するコマの位置
    stage: stage,
    loopCount: loopCount,
    bodyClass: bodyEl.className,     // そのときの背景色（warm / dawn / なし）
    counterText: counterEl.textContent,
  }));
  updateBackButton();
}

/* ---- 「1つ前に戻る」ボタンが押されたとき ---- */
function goBack() {
  // 演出・自動送り・選択の最中は戻らない（進行を壊さないための保険）
  if (choosing || autoAdvancing) return;
  if (history.length <= 1) return;  // 戻る先が無ければ何もしない

  // 文字を1文字ずつ出している途中なら、まず止める
  clearInterval(typeTimer);
  clearTimeout(autoTimer);
  typing = false;

  history.pop();                        // いま見ている画面を取り除く
  const snap = history[history.length - 1];  // その1つ前を取り出す
  restoreSnapshot(snap);                // 画面と進行状況を、その控えに復元する
  updateBackButton();
}

/* ---- 控え（スナップショット）を画面に復元する ---- */
function restoreSnapshot(snap) {
  // 進行状況を戻す
  script = snap.scriptCopy.slice();
  index = snap.index;
  stage = snap.stage;
  loopCount = snap.loopCount;
  bodyEl.className = snap.bodyClass;     // 背景色も戻す
  counterEl.textContent = snap.counterText;

  // 選択肢は消しておく
  choosing = false;
  currentChoice = null;
  pendingReturnToTitle = false;   // 戻った時に「タイトルへ戻る」合図が残らないように
  choicesEl.style.display = "none";
  menuEl.style.display = "none";   // 選択ボタンも隠す
  gameEl.style.cursor = "pointer";

  // どの画面に戻る場合も、名前パネルと思い出メニューと終幕ボタンはいったん隠す
  nameRevealEl.style.display = "none";
  menuEl.style.display = "none";             // 【ver4】思い出選択ボタンも隠す
  finishActionsEl.style.display = "none";
  finishActionsEl.style.animation = "";

  if (snap.kind === "text") {
    // ふつうの文章の画面に戻す
    textboxEl.style.display = "flex";
    titleEl.style.display = "none";
    noteEl.style.display = "none";
    speakerEl.textContent = snap.speaker || "";
    if (snap.serif) { textEl.classList.add("serif"); }
    else            { textEl.classList.remove("serif"); }
    // 【ver6・STEP D】セラの記録（独白）の見た目も、戻したときに反映する
    textboxEl.classList.toggle("log", !!snap.log);
    // 文章の見た目（ニュース音声／AIのセリフ）も、戻したときに反映する
    textboxEl.classList.toggle("tv", snap.voice === "tv");
    textboxEl.classList.toggle("ai", snap.voice === "ai");
    textboxEl.classList.toggle("rec", snap.voice === "rec");
    textboxEl.classList.toggle("montage", !!snap.montage);
    // 演出用クラスは戻ったときは出さない（静かに読める形で復元）
    textboxEl.classList.remove("glitch", "flow", "refrain", "garbling");
    textEl.textContent = snap.textShown;
    atLoopEnd = false;
    hintEl.textContent = "▼";
    hintEl.style.display = "block";
    // 戻った画面に flash 指定があれば、もう一度光らせる
    if (snap.flash) { triggerFlash(snap.flash); }
  } else if (snap.kind === "names") {
    // 2つの名前パネルの画面に戻す
    showNamesRestore();
    atLoopEnd = false;
    hintEl.textContent = "▼";
    hintEl.style.display = "block";
  } else {
    // 中央表示（ロゴ／エンド／完）に戻す
    textboxEl.classList.remove("log");   // 【ver6・STEP D】独白デザインは外しておく
    textboxEl.classList.remove("tv", "ai", "rec", "glitch", "montage", "flow", "refrain", "garbling");
    titleEl.classList.remove("logo");    // ロゴのスタイルは持ち越さない
    textboxEl.style.display = "none";
    titleEl.style.display = "block";
    titleEl.textContent = snap.titleText;
    if (snap.noteText) {
      noteEl.textContent = snap.noteText;
      noteEl.style.display = "block";
    } else {
      noteEl.style.display = "none";
    }
    atLoopEnd = snap.atLoopEnd;
    hintEl.textContent = snap.hintText || "▼";
    hintEl.style.display = snap.hintVisible ? "block" : "none";
  }
}

/* ---- 名前パネルを（履歴から戻したときに）もう一度出す。
   showNames と違い、履歴には積まない（戻る操作の最中なので）。 ---- */
function showNamesRestore() {
  textboxEl.style.display = "none";
  titleEl.style.display = "none";
  noteEl.style.display = "none";
  nameRevealEl.innerHTML = "";   // 前作の名前演出は削除（続編では未使用）
  nameRevealEl.style.display = "block";
}

/* ---- 戻れる履歴があるときだけ、ボタンを見せる ---- */
function updateBackButton() {
  backBtn.style.display = (history.length > 1) ? "block" : "none";
}

/* 「もどる」ボタンのクリック（画面全体のクリック＝前進と二重に反応しないようにする） */
backBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  goBack();
});

/* ---- 画面のどこかをクリックしたら1コマ進める ---- */
gameEl.addEventListener("click", advance);

/* ---- ゲーム開始：プロローグ＋1周目を再生する ---- */
function startGame() {
  loopCount = 1;
  stage = "normal";
  history = [];                 // 履歴をまっさらにする
  counterEl.textContent = "";   // プロローグ（回想）の間は通し番号を出さない
  memories.forEach((m) => (m.sold = false));  // 記憶の状態を初期化
  bodyEl.className = "";        // 背景をいったんまっさらに戻してから本編へ
  pendingReturnToTitle = false;
  atLoopEnd = false;
  choosing = false;
  picks = {};                  // 没入型の選択（choice1／alias）をまっさらに戻す
  // 本編の台本（プロローグ〜第4章）を最初から再生する。
  script = scenarioScript();
  index = 0;
  advance();
}

/* ---- タイトル画面：「はじめる」で本編へ ---- */
const titleScreenEl = document.getElementById("title-screen");
const titleStartBtn = document.getElementById("title-start-btn");

titleStartBtn.addEventListener("click", () => {
  titleScreenEl.classList.add("is-hidden");
  startGame();
});

/* 「続きから」：バッドエンド後に、選択の直前（第4章 4-4）から再開する */
const continueBtn = document.getElementById("title-continue-btn");
continueBtn.addEventListener("click", () => {
  titleScreenEl.classList.add("is-hidden");
  startFromChoice();
});

/* ---- 終幕ボタン ---- */
const finishActionsEl = document.getElementById("finish-actions");
const btnRestart      = document.getElementById("btn-restart");
const btnShare        = document.getElementById("btn-share");

/* 「最初から読み直す」：BGMを止め、ゲームをリセットしてタイトル画面に戻す */
btnRestart.addEventListener("click", (e) => {
  e.stopPropagation();   // gameEl の advance() を呼ばないようにする
  if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
  finishActionsEl.style.display = "none";
  finishActionsEl.style.animation = "";
  titleEl.style.display = "none";
  titleEl.classList.remove("logo");
  noteEl.style.display = "none";
  bodyEl.className = "";        // すべての背景クラスをまっさらに戻す
  titleScreenEl.classList.remove("is-hidden");
});

/* 「感想をXでシェア」：定型文入りのX投稿画面を新しいタブで開く */
btnShare.addEventListener("click", (e) => {
  e.stopPropagation();
  const tweetText =
    "『記憶を継いだ朝』を読み終えました。 " +
    "https://hiro9215koctwcx-glitch.github.io/aitools-portal/memory-morning/ " +
    "#記憶を継いだ朝 #ノベルゲーム";
  window.open(
    "https://x.com/intent/tweet?text=" + encodeURIComponent(tweetText),
    "_blank", "noopener,noreferrer"
  );
});

</script>
